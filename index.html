<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Payment Details</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }

    h1 {
      text-align: center;
      color: #111827;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 20px;
    }

    .bank-card {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 25px;
    }

    .bank-card h2 {
      margin: 0 0 15px;
      color: #1d4ed8;
      font-size: 19px;
    }

    .bank-row {
      margin: 10px 0;
    }

    .bank-label {
      font-size: 13px;
      color: #6b7280;
    }

    .bank-value {
      font-size: 16px;
      font-weight: bold;
      color: #111827;
      word-break: break-all;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #374151;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #9ca3af;
    }

    #status {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
    }

    .success {
      color: #16a34a;
    }

    .error {
      color: #dc2626;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>College Payment</h1>
  <div class="subtitle">UPI / Bank Payment Details</div>

  <!-- COLLEGE BANK DETAILS -->
  <div class="bank-card">

    <h2>🏦 College Bank Details</h2>

    <div class="bank-row">
      <div class="bank-label">Account Number</div>
      <div class="bank-value">090301000070001</div>
    </div>

    <div class="bank-row">
      <div class="bank-label">IFSC Code</div>
      <div class="bank-value">IOBA0000903</div>
    </div>

  </div>


  <form id="paymentForm">

    <label>Name</label>
    <input
      type="text"
      name="name"
      placeholder="Enter your name"
      required
    >

    <label>Mobile Number</label>
    <input
      type="tel"
      name="mobile"
      placeholder="Enter mobile number"
      pattern="[0-9]{10}"
      maxlength="10"
      required
    >

    <label>Register Number</label>
    <input
      type="text"
      name="registerNumber"
      placeholder="Enter register number"
      required
    >

    <label>Department</label>
    <select name="department" required>
      <option value="">Select Department</option>
      <option value="EEE">EEE</option>
      <option value="ECE">ECE</option>
      <option value="CSE">CSE</option>
      <option value="Mechanical">Mechanical</option>
      <option value="Civil">Civil</option>
    </select>

    <label>Year</label>
    <select name="year" required>
      <option value="">Select Year</option>
      <option value="1st Year">1st Year</option>
      <option value="2nd Year">2nd Year</option>
      <option value="3rd Year">3rd Year</option>
    </select>

    <label>Section</label>
    <input
      type="text"
      name="section"
      placeholder="Example: A"
      required
    >

    <label>Transaction Number</label>
    <input
      type="text"
      name="transactionNumber"
      placeholder="Enter UPI transaction number"
      required
    >

    <label>Amount</label>
    <input
      type="number"
      name="amount"
      placeholder="Enter amount"
      min="1"
      required
    >

    <label>Academic Year</label>
    <input
      type="text"
      name="academicYear"
      value="2026-27"
      required
    >

    <button type="submit" id="submitBtn">
      Submit Payment Details
    </button>

    <div id="status"></div>

  </form>

</div>


<script>

  // https://script.google.com/macros/s/AKfycbytDP-ICqB7tqMGu_KtHARq7BVp0nJ_gTa1dji6q7k1uhFM90h8kWmkPXDLHRlTxkq9/exec=
    "https://script.google.com/macros/s/AKfycbytDP-ICqB7tqMGu_KtHARq7BVp0nJ_gTa1dji6q7k1uhFM90h8kWmkPXDLHRlTxkq9/exec";

  const form = document.getElementById("paymentForm");
  const submitBtn = document.getElementById("submitBtn");
  const status = document.getElementById("status");

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";
    status.textContent = "";
    status.className = "";

    try {

      const formData = new FormData(form);

      await fetch(SCRIPT_URL, {
        method: "POST",
        body: formData,
        mode: "no-cors"
      });

      status.textContent =
        "✓ Payment details submitted successfully!";

      status.className = "success";

      form.reset();

      form.academicYear.value = "2026-27";

    } catch (error) {

      console.error(error);

      status.textContent =
        "✕ Something went wrong. Please try again.";

      status.className = "error";
    }

    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Payment Details";

  });

</script>

</body>
</html>
