<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Admin — Government Polytechnic College, Perundurai</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0a0f1f;color:#e7ecf5;margin:0;padding:20px}
.wrap{max-width:1100px;margin:auto}.card{background:#12182b;border:1px solid #29324a;border-radius:16px;padding:18px;margin-bottom:16px}
h1{margin-top:0}input,button{font:inherit;padding:11px 13px;border-radius:9px;border:1px solid #39445f}
input{background:#0d1425;color:#fff;width:100%;box-sizing:border-box;margin:5px 0 10px}
button{cursor:pointer;background:#2563eb;color:white;border:none;margin:4px 4px 4px 0}
button.secondary{background:#334155} button.danger{background:#b91c1c}
.hidden{display:none}.status{color:#93a0b8;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #29324a;text-align:left;vertical-align:top}th{color:#93a0b8}
.scroll{overflow:auto}.ok{color:#34d399}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="loginCard">
    <h1>Payment Admin</h1>
    <p>Login to view centrally submitted UPI payment details.</p>
    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Password">
    <button id="login">Login</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <div class="card hidden" id="adminCard">
    <h1>UPI Payment Records</h1>
    <div class="status" id="count"></div>
    <button id="refresh">Refresh</button>
    <button id="pdf">Export all records as PDF</button>
    <button id="logout" class="secondary">Logout</button>
    <div class="scroll">
      <table>
        <thead><tr><th>Date</th><th>Student</th><th>Reg. No.</th><th>Dept/Year</th><th>Amount</th><th>Method</th><th>UPI Reference</th><th>Status</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const SUPABASE_URL="YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const sb=(SUPABASE_URL.indexOf("YOUR_")===0)?null:supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let records=[];

function msg(s){document.getElementById("loginStatus").textContent=s}
async function login(){
  if(!sb){msg("Configure Supabase URL and anon key first.");return}
  const {error}=await sb.auth.signInWithPassword({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value
  });
  if(error){msg(error.message);return}
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("adminCard").classList.remove("hidden");
  load();
}
async function load(){
  const {data,error}=await sb.from("payment_submissions").select("*").order("created_at",{ascending:false});
  if(error){document.getElementById("count").textContent=error.message;return}
  records=data||[];
  document.getElementById("count").innerHTML='<span class="ok">'+records.length+'</span> record(s)';
  document.getElementById("rows").innerHTML=records.map(r=>`<tr>
    <td>${new Date(r.created_at).toLocaleString()}</td>
    <td>${esc(r.name)}</td><td>${esc(r.register_number)}</td>
    <td>${esc(r.department)}<br>${esc(r.year)} ${esc(r.section)}</td>
    <td>₹${Number(r.amount||0).toLocaleString("en-IN")}</td>
    <td>${esc(r.payment_method)}</td><td>${esc(r.upi_reference)}</td><td>${esc(r.status)}</td>
  </tr>`).join("");
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function exportPDF(){
  if(!records.length){alert("No records to export.");return}
  const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
  let y=15;
  doc.setFontSize(15);doc.text("UPI Payment Details — Government Polytechnic College, Perundurai",10,y);y+=8;
  doc.setFontSize(8);doc.text("Generated: "+new Date().toLocaleString(),10,y);y+=7;
  const headers=["Date","Name","Reg No","Department / Year","Amount","Method","UPI Reference","Status"];
  const widths=[29,30,27,54,20,24,45,25]; let x=10;
  doc.setFont(undefined,"bold"); headers.forEach((h,i)=>{doc.text(h,x,y);x+=widths[i]});y+=5;
  doc.setFont(undefined,"normal");
  records.forEach(r=>{
    if(y>190){doc.addPage();y=15;doc.setFont(undefined,"bold");x=10;headers.forEach((h,i)=>{doc.text(h,x,y);x+=widths[i]});y+=5;doc.setFont(undefined,"normal")}
    const vals=[
      new Date(r.created_at).toLocaleDateString(),
      r.name||"",r.register_number||"",
      ((r.department||"")+" / "+(r.year||"")+" "+(r.section||"")).slice(0,38),
      "₹"+Number(r.amount||0).toLocaleString("en-IN"),
      r.payment_method||"",r.upi_reference||"",r.status||""
    ];
    x=10; vals.forEach((v,i)=>{doc.text(String(v).slice(0,Math.max(8,Math.floor(widths[i]/1.8))),x,y);x+=widths[i]}); y+=5;
  });
  doc.save("upi-payment-details-"+new Date().toISOString().slice(0,10)+".pdf");
}
document.getElementById("login").onclick=login;
document.getElementById("refresh").onclick=load;
document.getElementById("pdf").onclick=exportPDF;
document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
</script>
</body>
</html>
